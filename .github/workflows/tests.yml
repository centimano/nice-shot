name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to a full commit SHA (not a movable
      # tag) so a compromised tag can't change what runs here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build app
        run: swift build
      - name: Run tests
        run: swift run NiceShotTests

  # A ready-to-run "Nice Shot Beta.app" for trying out a pull request:
  # download it from the run's Artifacts section.
  beta-app:
    name: Build beta app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build Nice Shot Beta.app
        run: ./build.sh --beta
      - name: Check signature (ad-hoc, hardened runtime)
        run: |
          codesign --verify --strict --verbose=2 "dist/Nice Shot Beta.app"
          codesign --display --verbose=2 "dist/Nice Shot Beta.app" 2>&1 | tee codesign.txt
          grep -Eq "flags=0x[0-9a-f]+\(.*runtime.*\)" codesign.txt
      - name: Launch smoke test
        run: |
          "dist/Nice Shot Beta.app/Contents/MacOS/NiceShot" &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::The app exited during launch"
            wait "$pid" || true
            exit 1
          fi
          kill "$pid"
      - name: Package
        # ditto keeps the bundle's permissions and signature intact.
        run: ditto -c -k --keepParent "dist/Nice Shot Beta.app" "dist/Nice-Shot-Beta.zip"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Nice-Shot-Beta
          path: dist/Nice-Shot-Beta.zip
          retention-days: 30
